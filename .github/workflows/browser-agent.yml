name: Browser gameplay agent

on:
  workflow_dispatch:
    inputs:
      games:
        description: Number of full browser games
        required: false
        default: '20'
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'css/**'
      - 'js/**'
      - 'rules/**'
      - 'scripts/rules-audit.mjs'
      - 'tests/**'
      - 'playwright.config.js'
      - 'package.json'
      - '.github/workflows/browser-agent.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'css/**'
      - 'js/**'
      - 'rules/**'
      - 'scripts/rules-audit.mjs'
      - 'tests/**'
      - 'playwright.config.js'
      - 'package.json'
      - '.github/workflows/browser-agent.yml'

permissions:
  contents: read

jobs:
  browser-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unit tests
        run: npm test

      - name: Rule conformance audit
        run: npm run rules:audit

      - name: Syntax checks
        run: npm run check

      - name: Install Playwright test runner
        run: npm install --no-save --no-package-lock @playwright/test@1.55.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Play full games and audit responsive readability
        env:
          UI_GAME_COUNT: ${{ github.event.inputs.games || '20' }}
        run: npx playwright test

      - name: Upload Playwright failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-evidence
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
